<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversational Data Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["Fira Code", "monospace"],
            },
            keyframes: {
              bounceDot: {
                "0%,60%,100%": { transform: "translateY(0)" },
                "30%": { transform: "translateY(-6px)" },
              },
            },
            animation: { bounceDot: "bounceDot 1.2s infinite" },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      .dot1 {
        animation: bounceDot 1.2s infinite;
      }
      .dot2 {
        animation: bounceDot 1.2s 0.2s infinite;
      }
      .dot3 {
        animation: bounceDot 1.2s 0.4s infinite;
      }
      @keyframes bounceDot {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>

  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
    <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
      <div
        class="absolute -top-60 -left-60 w-[700px] h-[700px] rounded-full bg-indigo-700/10 blur-3xl"
      ></div>
      <div
        class="absolute -bottom-60 -right-60 w-[600px] h-[600px] rounded-full bg-sky-600/10 blur-3xl"
      ></div>
    </div>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <header class="text-center mb-8 sm:mb-10">
        <h1
          class="text-3xl sm:text-4xl lg:text-5xl font-bold bg-gradient-to-br from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent leading-tight"
        >
          Conversational Data Analytics
        </h1>
        <p class="mt-3 text-sm sm:text-base text-slate-400 max-w-lg mx-auto">
          Upload your dataset and ask questions then charts generated
          automatically.
        </p>
      </header>
      <div class="grid grid-cols-1 lg:grid-cols-[360px_1fr] gap-5 items-start">
        <aside
          class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4"
        >
          <label
            id="dropZone"
            class="relative flex flex-col items-center justify-center gap-3 border-2 border-dashed border-slate-700 hover:border-indigo-500 hover:bg-indigo-500/5 rounded-xl px-4 py-9 cursor-pointer transition-all duration-200 text-center group"
          >
            <input
              type="file"
              id="fileInput"
              accept=".csv,.xlsx,.xls"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            />
            <div
              class="w-12 h-12 rounded-full bg-indigo-500/15 group-hover:bg-indigo-500/25 transition-colors flex items-center justify-center text-2xl"
            >
              📂
            </div>
            <div>
              <p id="dropLabel" class="text-sm font-medium text-slate-200">
                Click or drag file here
              </p>
              <p class="text-xs text-slate-500 mt-1">
                CSV, XLSX or XLS supported
              </p>
            </div>
          </label>

          <div
            id="uploadStatus"
            class="hidden text-xs rounded-xl px-3 py-2.5 leading-relaxed font-medium"
          ></div>

          <div id="datasetInfo" class="hidden">
            <p
              class="text-[10px] font-semibold tracking-[0.12em] uppercase text-slate-500 mb-2"
            >
              Columns detected
            </p>
            <div
              id="columnPills"
              class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto"
            ></div>
          </div>

          <!-- Upload button -->
          <button
            id="uploadBtn"
            onclick="uploadFile()"
            disabled
            class="flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 active:scale-[0.97] disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-150"
          >
            <svg
              id="uploadSpinner"
              class="hidden w-4 h-4 animate-spin"
              viewBox="0 0 24 24"
              fill="none"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="white"
                stroke-width="4"
              />
              <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8v8z" />
            </svg>
            <span id="uploadBtnText">Upload Dataset</span>
          </button>
        </aside>

        <!-- ════ RIGHT: Chat Panel ════ -->
        <section
          class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col gap-4"
        >
          <div
            id="chatWindow"
            class="flex-1 overflow-y-auto flex flex-col gap-3 pr-1 scroll-smooth"
          >
            <div
              id="emptyState"
              class="flex flex-col items-center justify-center h-full gap-4 text-center px-4 py-8"
            >
              <div
                class="w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-3xl"
              >
                💬
              </div>
              <div>
                <p class="text-sm font-medium text-slate-300">
                  No messages yet
                </p>
                <p class="text-xs text-slate-500 mt-1 max-w-xs">
                  Upload a file then ask something like.
                </p>
              </div>
            </div>
          </div>

          <div
            class="flex-shrink-0 flex gap-2.5 pt-4 border-t border-slate-800"
          >
            <input
              type="text"
              id="queryInput"
              placeholder="Ask a question about your data…"
              onkeydown="
                if (event.key === 'Enter' && !event.shiftKey) {
                  event.preventDefault();
                  sendQuery();
                }
              "
              class="flex-1 min-w-0 bg-slate-800 border border-slate-700 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500/30 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 transition-all"
            />
            <button
              id="sendBtn"
              onclick="sendQuery()"
              class="flex-shrink-0 flex items-center justify-center w-11 h-11 rounded-xl bg-sky-500 hover:bg-sky-400 active:scale-[0.95] disabled:opacity-40 disabled:cursor-not-allowed transition-all duration-150"
            >
              <svg
                class="w-4 h-4 text-white"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </button>
          </div>
        </section>
      </div>
    </div>

    <script>
      // ── Element refs ──────────────────────────────────────────────────────────
      const fileInput = document.getElementById("fileInput");
      const dropZone = document.getElementById("dropZone");
      const dropLabel = document.getElementById("dropLabel");
      const uploadBtn = document.getElementById("uploadBtn");
      const uploadSpinner = document.getElementById("uploadSpinner");
      const uploadBtnText = document.getElementById("uploadBtnText");
      const uploadStatus = document.getElementById("uploadStatus");
      const datasetInfo = document.getElementById("datasetInfo");
      const columnPills = document.getElementById("columnPills");
      const chatWindow = document.getElementById("chatWindow");
      const emptyState = document.getElementById("emptyState");
      const queryInput = document.getElementById("queryInput");
      const sendBtn = document.getElementById("sendBtn");

      fileInput.addEventListener("change", () => {
        const f = fileInput.files[0];
        if (f) {
          dropLabel.textContent = f.name;
          uploadBtn.disabled = false;
        }
      });

      ["dragover", "dragenter"].forEach((ev) =>
        dropZone.addEventListener(ev, (e) => {
          e.preventDefault();
          dropZone.classList.add("border-indigo-500", "bg-indigo-500/5");
        }),
      );
      ["dragleave", "dragend"].forEach((ev) =>
        dropZone.addEventListener(ev, () =>
          dropZone.classList.remove("border-indigo-500", "bg-indigo-500/5"),
        ),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("border-indigo-500", "bg-indigo-500/5");
        const f = e.dataTransfer.files[0];
        if (f) {
          fileInput.files = e.dataTransfer.files;
          dropLabel.textContent = f.name;
          uploadBtn.disabled = false;
        }
      });

      function showStatus(msg, ok) {
        uploadStatus.textContent = msg;
        uploadStatus.className = ok
          ? "text-xs rounded-xl px-3 py-2.5 leading-relaxed font-medium bg-emerald-500/10 border border-emerald-500/25 text-emerald-400"
          : "text-xs rounded-xl px-3 py-2.5 leading-relaxed font-medium bg-red-500/10 border border-red-500/25 text-red-400";
      }

      async function uploadFile() {
        if (!fileInput.files[0]) return;
        uploadBtn.disabled = true;
        uploadSpinner.classList.remove("hidden");
        uploadBtnText.textContent = "Uploading…";

        const fd = new FormData();
        fd.append("file", fileInput.files[0]);

        try {
          const res = await fetch("/upload", { method: "POST", body: fd });
          const data = await res.json();

          if (data.error) {
            showStatus("❌ " + data.error, false);
          } else {
            showStatus(
              `✅ ${data.message} · ${(data.rows || 0).toLocaleString()} rows`,
              true,
            );
            if (data.columns?.length) {
              columnPills.innerHTML = data.columns
                .map(
                  (c) =>
                    `<span class="font-mono text-[10px] bg-slate-800 border border-slate-700 text-sky-400 rounded-md px-2 py-0.5 whitespace-nowrap">${esc(c)}</span>`,
                )
                .join("");
              datasetInfo.classList.remove("hidden");
            }
          }
        } catch (err) {
          showStatus("❌ Upload failed: " + err.message, false);
        }

        uploadBtn.disabled = false;
        uploadSpinner.classList.add("hidden");
        uploadBtnText.textContent = "Upload Dataset";
      }

      function removeEmpty() {
        emptyState?.remove();
      }

      function appendBubble(role, html) {
        removeEmpty();
        const isUser = role === "user";

        const row = document.createElement("div");
        row.className = `flex gap-2.5 items-end ${isUser ? "flex-row-reverse" : ""}`;

        const av = document.createElement("div");
        av.className = isUser
          ? "w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-xs font-bold text-white flex-shrink-0 self-end hidden"
          : "w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white flex-shrink-0 self-end hidden";
        av.textContent = isUser ? "U" : "AI";

        const bub = document.createElement("div");
        bub.className = isUser
          ? "max-w-[78%] sm:max-w-[68%] rounded-2xl rounded-br-sm px-4 py-2.5 text-sm leading-relaxed bg-indigo-600/30 border border-indigo-500/30"
          : "max-w-[82%] sm:max-w-[76%] rounded-2xl rounded-bl-sm px-4 py-2.5 text-sm leading-relaxed bg-slate-800 border border-slate-700";
        bub.innerHTML = html;

        row.appendChild(av);
        row.appendChild(bub);
        chatWindow.appendChild(row);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return { row, bub };
      }

      function addTyping() {
        const { row, bub } = appendBubble("ai", "");
        bub.innerHTML = `
        <div class="flex items-center gap-1.5 py-1">
          <span class="dot1 w-2 h-2 rounded-full bg-slate-400 inline-block"></span>
          <span class="dot2 w-2 h-2 rounded-full bg-slate-400 inline-block"></span>
          <span class="dot3 w-2 h-2 rounded-full bg-slate-400 inline-block"></span>
        </div>`;
        return row;
      }

      async function sendQuery() {
        const q = queryInput.value.trim();
        if (!q) return;

        appendBubble("user", `<p>${esc(q)}</p>`);
        queryInput.value = "";
        sendBtn.disabled = true;

        const typingRow = addTyping();

        try {
          const res = await fetch("/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q }),
          });
          const data = await res.json();
          typingRow.remove();

          if (data.error) {
            appendBubble(
              "ai",
              `<p class="text-red-400">⚠️ ${esc(data.error)}</p>`,
            );
          } else {
            let html = `<p>${esc(data.result || "Analysis complete.")}</p>`;

            if (data.image) {
              html += `
              <div class="mt-3 rounded-xl overflow-hidden border border-slate-700">
                <img src="data:image/png;base64,${data.image}" alt="Generated chart" class="w-full block" />
              </div>`;
            }

            if (data.code) {
              html += `
              <details class="mt-3 rounded-xl overflow-hidden border border-slate-700">
                <summary class="cursor-pointer select-none px-3 py-2 bg-slate-900 hover:bg-slate-800 text-[10px] font-semibold tracking-[0.1em] uppercase text-slate-400 hover:text-slate-200 transition-colors hidden">
                  View generated code
                </summary>
                <pre class="font-mono text-[11px] text-indigo-300 bg-slate-950 p-3.5 overflow-x-auto whitespace-pre-wrap leading-relaxed hidden">${esc(data.code)}</pre>
              </details>`;
            }

            appendBubble("ai", html);
          }
        } catch (err) {
          typingRow.remove();
          appendBubble(
            "ai",
            `<p class="text-red-400">❌ Request failed: ${esc(err.message)}</p>`,
          );
        }

        sendBtn.disabled = false;
        queryInput.focus();
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
